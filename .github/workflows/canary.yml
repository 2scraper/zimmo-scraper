name: canary

# One real run daily against a known-good FILTERED CATEGORY URL
# (CLAUDE.md §11). Requests >=3 pages -- with one page, pagination is
# never exercised, which is exactly how a silent-single-page bug would
# survive undetected. Uploads artefacts on every run so a red canary can
# be diagnosed from the log alone.

on:
  schedule:
    - cron: "17 6 * * *"  # daily, off the hour to avoid the top-of-hour GitHub Actions crush
  workflow_dispatch: {}
  # Also run when THIS file changes. A canary is the one workflow that
  # can sit broken for a full day before anyone finds out.
  push:
    branches: [main]
    paths:
      - ".github/workflows/canary.yml"

jobs:
  canary:
    # jammy, pinned, for the same reason tests.yml's engine-smoke job
    # pins it: playwright==1.44.0 cannot install its system deps on
    # Ubuntu 24.04, and the Dockerfile's base image is v1.44.0-jammy.
    runs-on: ubuntu-22.04
    # What zimmo.be lets through, measured 2026-09-23 (README, "What you
    # need"): a residential exit AND a visible (headful) browser. Headless
    # Chromium is refused even from a Belgian home address, and a
    # datacentre address is refused either way. Until that date this job
    # was gated on TWOCAPTCHA_KEY -- a secret that buys nothing here, was
    # never set, and so made the canary SKIP every day while its badge
    # read green. The gate is now on ZIMMO_PROXY, the thing that actually
    # decides whether a run can pass; see the step notes below.
    env:
      HAS_ZIMMO_PROXY: ${{ secrets.ZIMMO_PROXY != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install core + Playwright
        run: |
          pip install -r requirements.txt -r requirements-playwright.txt
          playwright install --with-deps chromium
          sudo apt-get install -y xvfb

      - name: Run against a known-good filtered category, >=3 pages (headful, under xvfb)
        env:
          # The proxy goes through the ENVIRONMENT, never a command line
          # (CLAUDE.md §3, §11). An unset secret arrives as an empty
          # string, which env_config.py treats as unset.
          ZIMMO_PROXY: ${{ secrets.ZIMMO_PROXY }}
        run: |
          set +e
          if [ "$HAS_ZIMMO_PROXY" = "true" ]; then
            echo "[canary] route: headful Chromium under xvfb, through ZIMMO_PROXY"
          else
            echo "[canary] route: headful Chromium under xvfb, no proxy (the runner's own address)"
          fi
          xvfb-run -a python playwright_scraper.py \
            --url "https://www.zimmo.be/nl/gent-9000/te-koop/" \
            --pages 3 \
            --headful \
            --format both \
            --out canary_run \
            --dump-html
          code=$?
          echo "exit_code=$code" >> "$GITHUB_ENV"
          echo "[canary] engine exit code: $code"

      - name: Assert the run actually succeeded
        run: |
          python - <<'EOF'
          import json, os, sys

          code = int(os.environ.get("exit_code", "1"))
          has_proxy = os.environ.get("HAS_ZIMMO_PROXY") == "true"
          if code == 3 and not has_proxy:
              # Blocked from the runner's own address with no proxy
              # configured: the documented access condition, not a
              # scraper bug. A canary that cannot pass must say so
              # rather than go red every day (CLAUDE.md §11).
              print("::notice::zimmo.be refused this runner's address (exit 3) and no ZIMMO_PROXY "
                    "secret is set. The site needs a residential exit plus a headful browser "
                    "(README, 'What you need'). Add a residential proxy as the ZIMMO_PROXY "
                    "repository secret to make this canary test the scraper daily.")
              sys.exit(0)
          if code != 0:
              print(f"::error::engine exit code {code} (0 ok, 3 blocked, 4 zero rows, 5 content never obtained, 6 partial)")
              sys.exit(1)

          meta = json.load(open("canary_run.meta.json"))
          rows = json.load(open("canary_run.json"))
          n = len(rows)
          def share(key):
              return sum(1 for r in rows if r.get(key) is not None) / n

          print("status:", meta["status"], "| pages:", meta["pages_completed"], "/", meta["pages_requested"], "| rows:", n)
          for key in ("price", "location", "property_type", "listing_type", "surface_m2", "bedrooms", "epc_label"):
              print(f"  {key:14} {share(key):.0%}")

          # Floors from the 2026-09-23 runs (63 rows over 3 pages, every
          # engine): price 100%, property/listing type 100%, living area
          # 92%, bedrooms 76%, EPC 72%. Set below them, since a few
          # listings legitimately state no area, no bedrooms or no grade.
          assert meta["status"] == "complete", meta["status"]
          assert meta["pages_completed"] == 3, meta["pages_completed"]
          assert n >= 50, f"product floor not met: {n} < 50"
          assert share("price") >= 0.9, "price share"
          assert share("property_type") >= 0.95, "property_type share"
          assert share("listing_type") >= 0.95, "listing_type share"
          assert share("surface_m2") >= 0.6, "surface_m2 share"
          assert share("bedrooms") >= 0.4, "bedrooms share"
          assert share("epc_label") >= 0.4, "epc_label share"
          print("Canary: PASS")
          EOF

      - name: Upload artefacts (every run, pass or fail)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canary-run-${{ github.run_id }}
          path: |
            canary_run.json
            canary_run.csv
            canary_run.meta.json
            canary_run_page*_debug.html
            canary_run_page*_debug.png
          retention-days: 14
          if-no-files-found: ignore
